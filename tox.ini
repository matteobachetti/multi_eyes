[tox]
envlist =
    py{311,312,313,314}-test{,-devdeps}{,-cov}
    build_docs
    linkcheck
    codestyle
    check-build
requires =
    pip >= 19.3.1
isolated_build = true

[testenv]
# Environment names are made of factors separated by hyphens, e.g. py313-test-cov. A line
# below starting with `factor:` only applies if that factor is in the name. List them
# with `tox -l -v`.
description =
    run tests
    devdeps: against the development versions of astropy and astroquery
    cov: and measure coverage
    remote: including the tests that query HEASARC

passenv =
    HOME
    CI
    LC_ALL

set_env =
    remote: PYTEST_ADDOPTS = --remote-data

# Run in a temporary directory, so that the tests use the installed package and not the
# source tree.
change_dir = .tmp/{envname}

deps =
    cov: pytest-cov
    devdeps: git+https://github.com/astropy/astropy.git#egg=astropy
    devdeps: git+https://github.com/astropy/astroquery.git#egg=astroquery

extras =
    test

# `-c` makes the pytest settings in pyproject.toml apply from the temporary directory;
# without it, doctest_plus stays off and the doctests are silently not collected.
commands =
    pip freeze
    !cov: pytest -c {toxinidir}/pyproject.toml --pyargs multi_eyes {toxinidir}/tests {posargs}
    cov: pytest -c {toxinidir}/pyproject.toml --pyargs multi_eyes {toxinidir}/tests --cov multi_eyes --cov-report term-missing --cov-report xml:{toxinidir}/coverage.xml {posargs}

[testenv:build_docs]
description = build the HTML docs with sphinx, warnings as errors
change_dir = docs
extras = docs
commands =
    pip freeze
    sphinx-build -W -b html . _build/html

[testenv:linkcheck]
description = check that the links in the docs still resolve
change_dir = docs
extras = docs
commands =
    sphinx-build -W -b linkcheck . _build/linkcheck

[testenv:codestyle]
description = check code style with ruff
change_dir = .
skip_install = true
deps = ruff
commands =
    ruff check src tests docs
    ruff format --check src tests docs

[testenv:check-build]
description = check that the sdist builds and its metadata is valid
change_dir = .
skip_install = true
deps =
    build
    twine
commands =
    python -m build --sdist --outdir {toxinidir}/dist .
    twine check {toxinidir}/dist/*
